services:
  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data:rw
      - caddy-config:/config:rw
    environment:
      - SEARXNG_HOSTNAME=search.nexalexica.com
      - SEARXNG_TLS=internal
    networks:
      - searxng
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    depends_on:
      - searxng

  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "4000:8080"  # SearXNG mapped to port 4000 as requested
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://search.nexalexica.com/  # Use HTTP to avoid SSL issues
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    depends_on:
      - redis

  api:
    container_name: searxng-api
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "5001:5001"  # API exposed on port 5001
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/  # Use internal container URL for health checks
      - API_PORT=5001 # api port
      - VERIFY_SSL=false # verify ssl
      - MAX_RESULTS_LIMIT=20 # max results per search
      - REQUEST_TIMEOUT=15 # request timeout
      - RATE_LIMIT_REQUESTS=1000 # rate limit requests
      - RATE_LIMIT_WINDOW=3600 # rate limit window
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  searxng:

volumes:
  caddy-data:
  caddy-config:
  valkey-data2: